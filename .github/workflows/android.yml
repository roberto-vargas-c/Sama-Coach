name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships with the Android SDK at $ANDROID_HOME; licences are pre-accepted.
      - name: Build release APK (debug-signed, installable)
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report a failed build on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 6000 android/build.log > tail.txt || true
          printf '%s\n' "Android build failed. Last lines of the log:" '```' "$(cat tail.txt)" '```' > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(cat body.md)" || true

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk sama.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sama-apk
          path: sama.apk

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Sama Android app
          body: |
            Debug-signed APK of the Sama app (WebView around https://sama-coach-ai.vercel.app).
            On the phone: download `sama.apk`, open it, allow installing from this source.
          files: sama.apk
          prerelease: false
