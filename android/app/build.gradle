plugins {
    id 'com.android.application'
}

android {
    namespace 'app.sama.coach'
    compileSdk 35

    defaultConfig {
        applicationId "app.sama.coach"
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName "1.0"
        // The address the app opens. Override with -PsamaUrl=https://... when building.
        buildConfigField "String", "SAMA_URL", "\"" + (project.findProperty("samaUrl") ?: "https://sama-coach-ai.vercel.app") + "\""
    }
    buildFeatures { buildConfig true }
    lint { checkReleaseBuilds false; abortOnError false }
    signingConfigs {
        // A fixed demo key committed with the project, so every build updates cleanly over the previous one
        // (same trust level as Android's standard debug key). For the Play Store, generate your own private keystore.
        demo {
            storeFile file('sama-demo.jks')
            storePassword '91cc2738d2448776f31065f5f0121e34'
            keyAlias 'sama'
            keyPassword '91cc2738d2448776f31065f5f0121e34'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.demo
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // androidx libraries pull in two different Kotlin stdlib versions; pin one to avoid duplicate classes
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib:1.9.24') { because 'align the Kotlin stdlib across androidx dependencies' }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24') { because 'align the Kotlin stdlib across androidx dependencies' }
    }
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
}
